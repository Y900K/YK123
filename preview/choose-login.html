<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Login - Astra Attendance Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            color: #1e293b;
            background: linear-gradient(135deg, #475569 0%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #1e293b;
        }
        .subtitle {
            text-align: center;
            color: #475569;
            margin-bottom: 2rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .button {
            display: block;
            padding: 1.5rem;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1.125rem;
            transition: transform 0.2s;
            cursor: pointer;
            border: none;
        }
        .button:hover {
            transform: scale(1.02);
        }
        .button-employee {
            background: #06b6d4;
            color: white;
        }
        .button-admin {
            background: #1e293b;
            color: white;
        }
        .preview-label {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="preview-label">📱 PREVIEW MODE</div>
    <div class="container">
        <h1>Astra Attendance</h1>
        <p class="subtitle">Choose your login type</p>
        <div class="buttons">
            <a href="employee-login.html" class="button button-employee">
                Employee Login
            </a>
            <a href="admin-login.html" class="button button-admin">
                Admin Login
            </a>
        </div>
    </div>
</body>
</html>
