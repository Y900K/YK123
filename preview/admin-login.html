<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Astra Attendance Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            color: #1e293b;
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .warning-banner {
            background: #fef3c7;
            border: 2px solid #fbbf24;
            padding: 1rem;
            text-align: center;
            color: #92400e;
            font-weight: 500;
        }
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #1e293b;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0f172a;
        }
        .link {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
        }
        .link a {
            color: #06b6d4;
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }
        .preview-label {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="preview-label">📱 PREVIEW MODE</div>
    <div class="warning-banner">
        ⚠️ Admin Access - Use with caution
    </div>
    <div class="content">
        <div class="container">
            <h1>Admin Login</h1>
            <form>
                <div>
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Sign In as Admin</button>
            </form>
            <div class="link">
                <a href="employee-login.html">Employee Login</a>
            </div>
        </div>
    </div>
</body>
</html>
