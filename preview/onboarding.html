<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Astra Attendance Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            color: #1e293b;
            background: linear-gradient(135deg, #475569 0%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }
        .subtitle {
            color: #475569;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        label span {
            color: #ef4444;
        }
        input, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }
        .error {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }
        input.has-error {
            border-color: #ef4444;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #06b6d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0891b2;
        }
        .preview-label {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="preview-label">📱 PREVIEW MODE</div>
    <div class="container">
        <h1>Complete Your Profile</h1>
        <p class="subtitle">Please provide the following information to continue</p>
        <form>
            <div>
                <label>Full Name <span>*</span></label>
                <input type="text" placeholder="John Doe" value="">
                <!-- <p class="error">Full name must be at least 2 characters</p> -->
            </div>
            <div>
                <label>Employee Code <span>*</span></label>
                <input type="text" placeholder="EMP001" value="">
                <!-- <p class="error">Employee code is required</p> -->
            </div>
            <div>
                <label>Department <span>*</span></label>
                <select>
                    <option value="">Select Department</option>
                    <option value="1">Engineering</option>
                    <option value="2">Sales</option>
                    <option value="3">Marketing</option>
                    <option value="4">General</option>
                </select>
                <!-- <p class="error">Department is required</p> -->
            </div>
            <div>
                <label>Mobile Number <span>*</span></label>
                <input type="tel" placeholder="+1 (555) 123-4567" value="">
                <!-- <p class="error">Mobile number must be at least 10 digits</p> -->
            </div>
            <button type="submit">Complete Onboarding</button>
        </form>
    </div>
</body>
</html>
